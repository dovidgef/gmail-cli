# Run the same checks CI would, locally, before each commit.
#
# One-time setup (per clone):
#     uv sync --group dev
#     uv run pre-commit install
#
# Hooks all use `language: system` so they share the project's uv-managed venv
# (no isolated pre-commit envs to drift) and run the same `uv run` commands a
# human would type.

default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      # Auto-formats locally; pre-commit then fails the commit if anything
      # changed so you re-stage and retry.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: uv run mypy src/gmail_cli
        language: system
        pass_filenames: false
        files: ^src/.*\.py$

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$
